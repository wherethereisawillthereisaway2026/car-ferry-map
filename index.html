<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カーフェリー航路マップ</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; }
#app { display: flex; height: 100vh; overflow: hidden; }

/* SIDEBAR */
#sidebar { width: 280px; min-width: 280px; background: #0d1b2a; color: #eee;
           display: flex; flex-direction: column; z-index: 100; transition: width .3s; }
#sidebar.collapsed { width: 0; min-width: 0; overflow: hidden; }
#sb-toggle { position: fixed; top: 50%; left: 280px; transform: translateY(-50%);
             z-index: 200; background: #0d1b2a; color: #eee; border: none;
             width: 20px; height: 50px; cursor: pointer; border-radius: 0 6px 6px 0;
             font-size: 11px; transition: left .3s; }
#sb-toggle.collapsed { left: 0; }

#sb-header { padding: 14px 12px 8px; border-bottom: 1px solid #222; display: flex; align-items: center; gap: 8px; }
#sb-header h1 { font-size: 15px; font-weight: 700; color: #5bc8fa; line-height: 1.4; flex: 1; }
#sb-header p  { font-size: 11px; color: #888; margin-top: 4px; }
#aerial-btn { background: #1a3a5c; color: #5bc8fa; border: 1px solid #2a5a8c; padding: 4px 10px;
              border-radius: 4px; font-size: 11px; font-weight: 600; cursor: pointer;
              transition: background .2s; white-space: nowrap; flex-shrink: 0; }
#aerial-btn:hover { background: #2a5a8c; }
#aerial-btn.active { background: #5bc8fa; color: #0d1b2a; }

#search-wrap { padding: 8px 10px; }
#search { width: 100%; padding: 6px 10px; border-radius: 20px;
          border: none; background: #1e2d3d; color: #eee; font-size: 13px; outline: none; }
#search::placeholder { color: #666; }

#port-list { flex: 1; overflow-y: auto; padding: 4px 0; }
#port-list::-webkit-scrollbar { width: 4px; }
#port-list::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

.pitem { padding: 6px 12px; cursor: pointer; font-size: 12px; transition: background .1s;
         display: flex; align-items: center; gap: 6px; }
.pitem:hover { background: #1e2d3d; }
.pitem.active { background: #1a3a5c; }
.pname { flex: 1; }
.ppref { font-size: 10px; color: #666; }
.pdot  { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

/* MAP */
#map-wrap { flex: 1; position: relative; }
#map { width: 100%; height: 100%; }

/* INFO PANEL */
#info-panel { position: fixed; top: 0; right: -380px; width: 360px; height: 100%;
              background: #fff; box-shadow: -4px 0 24px rgba(0,0,0,.18);
              z-index: 150; transition: right .28s ease;
              display: flex; flex-direction: column; }
#info-panel.open { right: 0; }
.ph { padding: 12px 14px 10px; background: #0d1b2a; flex-shrink: 0; position: relative; }
.ph-name { font-size: 17px; font-weight: 700; color: #fff; padding-right: 32px; }
.ph-meta { font-size: 11px; color: #89c4e1; margin-top: 3px; }
.ph-close { position: absolute; top: 10px; right: 10px; background: rgba(255,255,255,.12);
            border: none; font-size: 18px; color: #ccc; width: 28px; height: 28px;
            border-radius: 50%; cursor: pointer; line-height: 28px; text-align: center; }

.pb { overflow-y: auto; flex: 1; padding-bottom: 16px; }
.pb::-webkit-scrollbar { width: 4px; }
.pb::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }

.sec-title { font-size: 11px; font-weight: 700; color: #999; padding: 10px 14px 4px;
             letter-spacing: .06em; text-transform: uppercase; }

.comp-row { display: flex; align-items: center; gap: 8px; padding: 7px 14px;
            border-bottom: 1px solid #f0f0f0; cursor: pointer; transition: background .1s; }
.comp-row:hover { background: #f5f7fa; }
.comp-color { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
.comp-name { font-size: 13px; flex: 1; }
.comp-badge { font-size: 10px; padding: 2px 6px; border-radius: 8px; font-weight: 600; }
.comp-badge.car { background: #e3f2fd; color: #1565c0; }
.comp-badge.pass { background: #f3e5f5; color: #6a1b9a; }
.comp-toggle { font-size: 11px; color: #aaa; margin-left: 4px; }
.comp-chain { padding: 4px 14px 8px 34px; font-size: 11px; color: #555;
              border-bottom: 1px solid #f5f5f5; display: none; }
.comp-chain.open { display: block; }
.chain-line { display: flex; align-items: center; flex-wrap: wrap; gap: 2px; margin-bottom: 3px; }
.chain-port { background: #f0f4f8; padding: 1px 5px; border-radius: 3px; font-size: 11px; }
.chain-arrow { color: #aaa; font-size: 10px; }
.comp-link { display: inline-block; margin-top: 4px; font-size: 11px; color: #1565c0;
             text-decoration: none; background: #e8f0fe; padding: 2px 6px; border-radius: 4px; }

/* LOADING */
#loading { position: fixed; inset: 0; background: rgba(13,27,42,.85); z-index: 999;
           display: flex; align-items: center; justify-content: center; color: #fff;
           font-size: 14px; flex-direction: column; gap: 12px; }
.spinner { width: 36px; height: 36px; border: 3px solid rgba(255,255,255,.2);
           border-top-color: #5bc8fa; border-radius: 50%;
           animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* MAP OVERLAY */
#overlay { position: absolute; top: 10px; left: 10px; z-index: 50;
           background: rgba(13,27,42,.82); color: #fff; padding: 7px 12px;
           border-radius: 8px; font-size: 11px; pointer-events: none; line-height: 1.6; }
#overlay b { color: #5bc8fa; display: block; font-size: 13px; }

/* ---- BOTTOM SHEET (スマホ専用) ---- */
#bs-wrap { display: none; }

@media (max-width: 640px) {
  #sidebar { display: none !important; }
  #sb-toggle { display: none !important; }
  #info-panel { display: none !important; }

  #bs-wrap {
    display: flex;
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #fff;
    border-radius: 14px 14px 0 0;
    box-shadow: 0 -3px 16px rgba(0,0,0,.18);
    z-index: 300;
    height: 72px;
    transition: height 0.25s ease;
    flex-direction: column;
    overflow: hidden;
  }
  #bs-handle-bar {
    width: 40px; height: 4px; background: #ddd; border-radius: 2px;
    margin: 8px auto 0;
    flex-shrink: 0;
  }
  #bs-top {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 12px 6px;
    flex-shrink: 0;
    border-bottom: 1px solid #eee;
  }
  #bs-back {
    border: none; background: none; color: #1565c0;
    font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  #bs-search {
    flex: 1; border: 1px solid #ddd; border-radius: 20px;
    padding: 6px 12px; font-size: 13px; outline: none;
  }
  #bs-body {
    flex: 1; overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  #bs-list .pitem { padding: 8px 14px; border-bottom: 1px solid #f0f0f0; }
}
</style>
</head>
<body>
<div id="loading"><div class="spinner"></div><div>データ読み込み中...</div></div>

<div id="app">
  <div id="sidebar">
    <div id="sb-header">
      <div style="flex: 1;">
        <h1>⚓ カーフェリー航路マップ</h1>
        <p>港をクリック → 航路を表示</p>
      </div>
      <button id="aerial-btn" onclick="toggleAerialView()">航空写真</button>
    </div>
    <div id="search-wrap">
      <input id="search" type="text" placeholder="港を検索...">
    </div>
    <div id="port-list"></div>
  </div>

  <button id="sb-toggle" onclick="toggleSidebar()">◀</button>

  <div id="map-wrap">
    <div id="map"></div>
    <div id="overlay">
      <b>カーフェリー航路マップ</b>
      港アイコンをクリック → 航路が表示されます
    </div>
  </div>
</div>

<div id="info-panel">
  <div class="ph">
    <div class="ph-name" id="ph-name">-</div>
    <div class="ph-meta" id="ph-meta"></div>
    <button class="ph-close" onclick="closePanel()">✕</button>
  </div>
  <div class="pb" id="pb"></div>
</div>

<!-- スマホ専用ボトムシート（PCは display:none） -->
<div id="bs-wrap">
  <div id="bs-handle-bar"></div>
  <div id="bs-top">
    <button id="bs-back" onclick="bsShowList()" style="display:none">← 一覧</button>
    <input id="bs-search" type="text" placeholder="港を検索...">
  </div>
  <div id="bs-body">
    <div id="bs-list"></div>
    <div id="bs-detail" style="display:none"></div>
  </div>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzk56d0-WugXg5l2p1AXEmaLjpDioGSaWRYQS4Kte9AWYcIds88jYk3SLyd4nUZPmK6/exec';

// 会社ごとの色パレット
const PALETTE = [
  '#1565c0','#00838f','#2e7d32','#6a1b9a','#c62828',
  '#e65100','#37474f','#1b5e20','#880e4f','#004d40',
  '#0d47a1','#33691e','#b71c1c','#4a148c','#006064',
  '#01579b','#558b2f','#827717','#bf360c','#4e342e'
];
const compColor = {};

let D = null; // route_data
let map, activeMarker = null;
const markerMap = {}; // port_id -> marker
const activeLines = [];
let aerialMode = false;

function getColor(compId) {
  if (!compColor[compId]) {
    const idx = Object.keys(compColor).length % PALETTE.length;
    compColor[compId] = PALETTE[idx];
  }
  return compColor[compId];
}

// ---- データ読み込み ----
async function loadData() {
  const url = GAS_URL + '?fn=exportRouteData';
  const resp = await fetch(url);
  D = await resp.json();
}

// ---- マップ状態の保存・復元 ----
function saveMapState() {
  if (!map) return;
  const center = map.getCenter();
  const zoom = map.getZoom();
  localStorage.setItem('mapCenter', JSON.stringify({ lat: center.lat(), lng: center.lng() }));
  localStorage.setItem('mapZoom', zoom.toString());
  localStorage.setItem('aerialMode', aerialMode.toString());
}

function loadMapState() {
  const saved = {
    center: localStorage.getItem('mapCenter'),
    zoom: localStorage.getItem('mapZoom'),
    aerial: localStorage.getItem('aerialMode')
  };
  return {
    center: saved.center ? JSON.parse(saved.center) : { lat: 33.5, lng: 132.0 },
    zoom: saved.zoom ? parseInt(saved.zoom) : 5,
    aerial: saved.aerial === 'true'
  };
}

// ---- マップ初期化 ----
function initMap() {
  const state = loadMapState();
  map = new google.maps.Map(document.getElementById('map'), {
    center: state.center,
    zoom: state.zoom,
    mapTypeId: state.aerial ? 'satellite' : 'roadmap',
    mapTypeControl: true,
    streetViewControl: false,
    fullscreenControl: true,
    gestureHandling: 'greedy',
    styles: [
      { featureType: 'water', stylers: [{ color: '#a8d5e5' }] },
    ]
  });

  // 航空写真ボタンの状態を同期
  if (state.aerial) {
    aerialMode = true;
    document.getElementById('aerial-btn').classList.add('active');
  }

  // マップ状態の変更を監視
  map.addListener('center_changed', saveMapState);
  map.addListener('zoom_changed', saveMapState);

  loadData().then(() => {
    document.getElementById('loading').style.display = 'none';
    renderPorts();
    renderPortList();
  }).catch(err => {
    document.getElementById('loading').innerHTML =
      '<div style="color:#f66">データ読み込み失敗<br>' + err.message + '</div>';
  });
}

function portIcon(hasRoute) {
  const color = hasRoute ? '#1565c0' : '#888';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20">
    <circle cx="10" cy="10" r="7" fill="${color}" stroke="white" stroke-width="2"/>
  </svg>`;
  return {
    url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg),
    scaledSize: new google.maps.Size(20, 20),
    anchor: new google.maps.Point(10, 10),
  };
}

function renderPorts() {
  Object.values(D.ports).forEach(p => {
    const hasRoute = !!D.port_companies[p.id];
    const marker = new google.maps.Marker({
      position: { lat: p.lat, lng: p.lng },
      map,
      title: p.name,
      icon: portIcon(hasRoute),
      zIndex: hasRoute ? 2 : 1,
    });
    if (hasRoute) {
      marker.addListener('click', () => selectPort(p.id));
    }
    markerMap[p.id] = marker;
  });
}

// ---- サイドバー港リスト ----
function renderPortList(filter = '') {
  const lc = filter.toLowerCase();
  const items = Object.values(D.ports)
    .filter(p => D.port_companies[p.id])
    .filter(p => !lc || p.name.toLowerCase().includes(lc) || p.location.toLowerCase().includes(lc) || p.pref.toLowerCase().includes(lc))
    .sort((a, b) => a.name.localeCompare(b.name, 'ja'));

  const html = items.map(p => `
    <div class="pitem" data-id="${p.id}" onclick="selectPort('${p.id}')">
      <div class="pdot" style="background:${getCompGroupColor(p.id)}"></div>
      <div class="pname">${p.name}</div>
      <div class="ppref">${p.pref}</div>
    </div>`).join('');

  // デスクトップ: #port-list
  const list = document.getElementById('port-list');
  if (list) list.innerHTML = html;

  // スマホ: #bs-list
  const bsList = document.getElementById('bs-list');
  if (bsList) bsList.innerHTML = html;
}

function getCompGroupColor(portId) {
  const comps = D.port_companies[portId] || [];
  if (comps.length === 0) return '#888';
  return getColor(comps[0]);
}

document.getElementById('search').addEventListener('input', e => {
  renderPortList(e.target.value);
});

document.getElementById('bs-search').addEventListener('input', e => {
  renderPortList(e.target.value);
});

// ---- 港選択 ----
function selectPort(portId) {
  clearLines();
  const port = D.ports[portId];
  if (!port) return;

  // マーカー強調
  Object.values(markerMap).forEach(m => m.setZIndex(1));
  if (markerMap[portId]) markerMap[portId].setZIndex(10);

  // サイドバーのアクティブ状態
  document.querySelectorAll('.pitem').forEach(el => {
    el.classList.toggle('active', el.dataset.id === portId);
  });

  // パネルコンテンツ生成（デスクトップ・スマホ共通）
  const compIds = D.port_companies[portId] || [];
  let bodyHtml = '<div class="sec-title">この港の航路（会社別）</div>';

  compIds.forEach(cid => {
    const comp = D.companies[cid] || { name: cid, url: '' };
    const color = getColor(cid);
    const segs = (D.comp_segments[cid] || []).map(i => D.segments[i]);
    const carFerry = segs.some(s => s.is_car_ferry);

    const chains = buildChains(segs);

    const chainHtml = chains.map(chain => {
      const portNames = chain.map(pid => {
        const p = D.ports[pid];
        return `<span class="chain-port">${p ? p.name : pid}</span>`;
      }).join('<span class="chain-arrow">→</span>');
      return `<div class="chain-line">${portNames}</div>`;
    }).join('');

    const linkHtml = comp.url
      ? `<a class="comp-link" href="${comp.url}" target="_blank">公式サイト ↗</a>`
      : '';

    const rowId = 'comp-' + cid;
    bodyHtml += `
      <div class="comp-row" onclick="toggleChain('${rowId}', '${cid}')">
        <div class="comp-color" style="background:${color}"></div>
        <div class="comp-name">${comp.name}</div>
        <span class="comp-badge ${carFerry ? 'car' : 'pass'}">${carFerry ? 'カーフェリー' : '旅客船'}</span>
        <span class="comp-toggle">▼</span>
      </div>
      <div class="comp-chain" id="${rowId}">
        ${chainHtml}${linkHtml}
      </div>`;

    // 航路ライン描画
    drawCompLines(cid, segs, color);
  });

  if (window.innerWidth <= 640) {
    // スマホ: ボトムシート詳細表示
    bsShowDetail(portId, port, bodyHtml);
  } else {
    // デスクトップ: 既存 info-panel
    document.getElementById('ph-name').textContent = port.name;
    document.getElementById('ph-meta').textContent = port.location + '  ' + port.pref;
    document.getElementById('pb').innerHTML = bodyHtml;
    document.getElementById('info-panel').classList.add('open');
  }

  map.panTo({ lat: port.lat, lng: port.lng });
}

function toggleChain(rowId, cid) {
  const el = document.getElementById(rowId);
  el.classList.toggle('open');
  const toggle = el.previousElementSibling.querySelector('.comp-toggle');
  if (toggle) toggle.textContent = el.classList.contains('open') ? '▲' : '▼';
}

// ---- チェーン構築（無向グラフの連結成分を辿って順序付け）----
function buildChains(segs) {
  const adj = {};
  segs.forEach(s => {
    (adj[s.port_a] = adj[s.port_a] || []).push(s.port_b);
    (adj[s.port_b] = adj[s.port_b] || []).push(s.port_a);
  });

  // 次数1の頂点（端点）を起点にしてチェーン構築
  const visited = new Set();
  const chains = [];
  const ports = new Set(segs.flatMap(s => [s.port_a, s.port_b]));

  // 端点（次数1）を起点に優先
  const endpoints = [...ports].filter(p => adj[p].length === 1);
  const starts = endpoints.length ? endpoints : [...ports];

  for (const start of starts) {
    if (visited.has(start)) continue;
    const chain = [];
    let cur = start, prev = null;
    while (cur && !visited.has(cur)) {
      visited.add(cur);
      chain.push(cur);
      const nexts = (adj[cur] || []).filter(n => !visited.has(n));
      prev = cur;
      cur = nexts[0] || null;
    }
    if (chain.length >= 2) chains.push(chain);
  }
  return chains;
}

// ---- 航路ライン描画 ----
function drawCompLines(cid, segs, color) {
  const drawnEdges = new Set();
  segs.forEach(seg => {
    const key = [seg.port_a, seg.port_b].sort().join('|');
    if (drawnEdges.has(key)) return;
    drawnEdges.add(key);

    const pa = D.ports[seg.port_a];
    const pb = D.ports[seg.port_b];
    if (!pa || !pb) return;

    const line = new google.maps.Polyline({
      path: [{ lat: pa.lat, lng: pa.lng }, { lat: pb.lat, lng: pb.lng }],
      geodesic: true,
      strokeColor: color,
      strokeOpacity: 0,
      icons: [{
        icon: { path: 'M 0,-1 0,1', strokeOpacity: 1, scale: 3 },
        offset: '0',
        repeat: '20px',
      }],
      strokeWeight: 2,
      map,
    });
    activeLines.push(line);
  });
}

function clearLines() {
  activeLines.forEach(l => l.setMap(null));
  activeLines.length = 0;
}

function closePanel() {
  document.getElementById('info-panel').classList.remove('open');
  clearLines();
  document.querySelectorAll('.pitem').forEach(el => el.classList.remove('active'));
}

// ---- サイドバートグル ----
let sbOpen = true;
function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  const btn = document.getElementById('sb-toggle');
  sbOpen = !sbOpen;
  sb.classList.toggle('collapsed', !sbOpen);
  btn.classList.toggle('collapsed', !sbOpen);
  btn.textContent = sbOpen ? '◀' : '▶';
}

// ---- 航空写真トグル ----
function toggleAerialView() {
  if (!map) return;
  aerialMode = !aerialMode;
  map.setMapTypeId(aerialMode ? 'satellite' : 'roadmap');
  const btn = document.getElementById('aerial-btn');
  btn.classList.toggle('active', aerialMode);
  saveMapState();
}

// ---- ボトムシート 3段階ドラッグ ----
const STAGES = () => [72, Math.round(window.innerHeight * 0.45), Math.round(window.innerHeight * 0.88)];
let bsH = 72;

function snapBs(targetH) {
  const stages = STAGES();
  bsH = stages.reduce((a, b) => Math.abs(b - targetH) < Math.abs(a - targetH) ? b : a);
  const wrap = document.getElementById('bs-wrap');
  if (wrap) wrap.style.height = bsH + 'px';
}

(function initBsDrag() {
  let startY = 0, startH = 0, dragging = false;

  function onTouchStart(e) {
    startY = e.touches[0].clientY;
    startH = parseInt(document.getElementById('bs-wrap').style.height) || bsH;
    dragging = true;
  }
  function onTouchMove(e) {
    if (!dragging) return;
    const deltaY = startY - e.touches[0].clientY;
    const newH = Math.max(72, Math.min(STAGES()[2], startH + deltaY));
    document.getElementById('bs-wrap').style.height = newH + 'px';
    document.getElementById('bs-wrap').style.transition = 'none';
  }
  function onTouchEnd(e) {
    if (!dragging) return;
    dragging = false;
    const currentH = parseInt(document.getElementById('bs-wrap').style.height) || bsH;
    document.getElementById('bs-wrap').style.transition = 'height 0.25s ease';
    snapBs(currentH);
  }

  document.addEventListener('DOMContentLoaded', () => {
    const handle = document.getElementById('bs-handle-bar');
    const top = document.getElementById('bs-top');
    [handle, top].forEach(el => {
      if (!el) return;
      el.addEventListener('touchstart', onTouchStart, { passive: true });
      el.addEventListener('touchmove', onTouchMove, { passive: true });
      el.addEventListener('touchend', onTouchEnd);
    });
  });
})();

// ---- ボトムシート 一覧表示 ----
function bsShowList() {
  const bsList = document.getElementById('bs-list');
  const bsDetail = document.getElementById('bs-detail');
  const bsBack = document.getElementById('bs-back');
  if (bsList) bsList.style.display = '';
  if (bsDetail) { bsDetail.style.display = 'none'; bsDetail.innerHTML = ''; }
  if (bsBack) bsBack.style.display = 'none';
  clearLines();
  document.querySelectorAll('.pitem').forEach(el => el.classList.remove('active'));
}

// ---- ボトムシート 詳細表示 ----
function bsShowDetail(portId, port, bodyHtml) {
  const bsList = document.getElementById('bs-list');
  const bsDetail = document.getElementById('bs-detail');
  const bsBack = document.getElementById('bs-back');

  if (bsList) bsList.style.display = 'none';
  if (bsDetail) {
    bsDetail.style.display = '';
    bsDetail.innerHTML = `
      <div class="ph" style="background:#0d1b2a; padding:12px 14px 10px;">
        <div class="ph-name" style="font-size:16px; font-weight:700; color:#fff; padding-right:0;">${port.name}</div>
        <div class="ph-meta" style="font-size:11px; color:#89c4e1; margin-top:3px;">${port.location}  ${port.pref}</div>
      </div>
      ${bodyHtml}`;
  }
  if (bsBack) bsBack.style.display = '';

  // HALFにスナップ
  const stages = STAGES();
  bsH = stages[1];
  const wrap = document.getElementById('bs-wrap');
  if (wrap) wrap.style.height = bsH + 'px';
}
</script>
